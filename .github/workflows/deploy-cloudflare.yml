name: Deploy Word Study to Cloudflare Pages

# main -> production (Cloudflare Pages project "wordstudy")
# dev  -> development (Cloudflare Pages project "wordstudy-dev")
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick Cloudflare Pages project
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "project=wordstudy" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "project=wordstudy-dev" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Only main and dev are deployed."
            exit 1
          fi

      - name: Prepare site
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest manifest-tablet.webmanifest sw.js dist/
          cp -r icons dist/icons

          # Stamp the page with the actual build time (Korea time).
          BUILD_TIME="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          sed -i "s|__LATEST_UPDATE__|${BUILD_TIME}|g" dist/index.html

          # Unique id for this deploy. The page compares it with version.json to reload itself after an update.
          BUILD_VERSION="${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -i "s|__BUILD_VERSION__|${BUILD_VERSION}|g" dist/index.html dist/sw.js
          printf '{"version":"%s"}\n' "${BUILD_VERSION}" > dist/version.json

          # Development install shows as "Word Study 개발" on the home screen.
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            sed -i 's|"name": "Word Study"|"name": "Word Study 개발"|; s|"short_name": "Word Study"|"short_name": "Word Study 개발"|' dist/manifest.webmanifest dist/manifest-tablet.webmanifest
            sed -i 's|<meta name="apple-mobile-web-app-title" content="Word Study">|<meta name="apple-mobile-web-app-title" content="Word Study 개발">|; s|<title>Word Study</title>|<title>Word Study 개발</title>|' dist/index.html
            grep -q '"name": "Word Study 개발"' dist/manifest-tablet.webmanifest && grep -q '"name": "Word Study 개발"' dist/manifest.webmanifest || { echo "::error::Development app name was not applied."; exit 1; }
          fi

          # Fail the build rather than publish a visible placeholder.
          if grep -qE '__LATEST_UPDATE__|__BUILD_VERSION__' dist/index.html dist/sw.js; then
            echo "::error::Build placeholders were not replaced."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.target.outputs.project }} --branch=${{ github.ref_name }} --commit-dirty=true
