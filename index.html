<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파닉스 & 단어 카드 학습기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .card-shadow { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        .pulse-btn { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800 flex flex-col items-center justify-between p-4 sm:p-6">

    <header class="w-full max-w-xl text-center py-4">
        <div class="inline-flex items-center justify-center bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-semibold shadow-md mb-2">
            <i class="fa-solid fa-graduation-cap mr-2"></i> AI 스마트 단어 학습기
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">영어 단어장 카드 학습</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">이미지를 올리거나 기본 단어장으로 발음, 뜻, 예문을 학습하세요!</p>
    </header>

    <main class="w-full max-w-xl flex-1 flex flex-col justify-center my-2">

        <!-- Upload View -->
        <div id="uploadView" class="bg-white rounded-3xl p-6 sm:p-8 card-shadow border border-slate-100 text-center transition-all duration-300">
            <div class="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h2 class="text-lg sm:text-xl font-bold text-slate-800 mb-2">단어장 사진을 올려주세요</h2>
            <p class="text-xs sm:text-sm text-slate-500 mb-6">스마트폰이나 PC에서 단어장 사진을 선택하시면 AI가 단어를 인식합니다.</p>

            <label class="block w-full cursor-pointer bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg transition-all transform active:scale-95 text-center mb-3">
                <i class="fa-solid fa-image mr-2"></i> 사진 파일 선택하기
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            </label>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-xs font-medium">또는</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <button onclick="loadDefaultWords()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-6 rounded-2xl transition-all text-sm mt-1">
                <i class="fa-solid fa-book-open mr-2 text-indigo-500"></i> 기본 단어장 (web, pen, wet...) 체험하기
            </button>
        </div>

        <!-- Loading View -->
        <div id="loadingView" class="hidden bg-white rounded-3xl p-10 card-shadow border border-slate-100 text-center">
            <div class="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h3 class="text-lg font-bold text-slate-800" id="loadingText">AI가 이미지를 분석하고 있습니다...</h3>
            <p class="text-xs text-slate-500 mt-1">단어 추출 및 뜻/예문을 생성 중입니다.</p>
        </div>

        <!-- Learning Card View -->
        <div id="cardView" class="hidden flex flex-col gap-4">
            <!-- Progress & Controls Top -->
            <div class="flex items-center justify-between px-2">
                <button onclick="backToUpload()" class="text-xs font-semibold text-slate-500 hover:text-indigo-600 bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> 다른 사진 올리기
                </button>
                <div class="bg-indigo-50 text-indigo-700 font-bold px-3 py-1 rounded-full text-xs" id="progressIndicator">
                    1 / 10
                </div>
            </div>

            <!-- Flash Card Main -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 card-shadow border border-slate-100 flex flex-col items-center relative overflow-hidden min-h-[340px] justify-between">
                
                <!-- Top Audio & Word Type -->
                <div class="w-full flex justify-between items-center text-xs text-slate-400 font-medium">
                    <span id="wordIndexBadge" class="bg-slate-100 px-2.5 py-1 rounded-lg text-slate-600">Word #1</span>
                    <button onclick="speakCurrentWord()" class="w-10 h-10 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center transition-all shadow-sm active:scale-95 pulse-btn" title="발음 듣기">
                        <i class="fa-solid fa-volume-high text-lg"></i>
                    </button>
                </div>

                <!-- Word & Meaning Center -->
                <div class="text-center my-auto py-2">
                    <h2 id="cardWord" class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight mb-2">web</h2>
                    <div class="flex items-center justify-center gap-2 text-indigo-600 font-semibold text-sm sm:text-base mb-4">
                        <span id="cardMeaning">거미줄, 웹</span>
                    </div>
                    
                    <!-- Example Box -->
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 text-left w-full mt-2">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-wider">Example Sentence</span>
                            <button onclick="speakExample()" class="text-slate-400 hover:text-indigo-600 text-xs">
                                <i class="fa-solid fa-volume-low"></i> 예문 듣기
                            </button>
                        </div>
                        <p id="cardExampleEn" class="text-sm font-semibold text-slate-800">The spider made a web.</p>
                        <p id="cardExampleKo" class="text-xs text-slate-500 mt-0.5">거미가 거미줄을 만들었습니다.</p>
                    </div>
                </div>

                <!-- Navigation Bottom Buttons inside Card -->
                <div class="w-full grid grid-cols-2 gap-3 pt-4 border-t border-slate-100">
                    <button onclick="prevCard()" id="prevBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl transition flex items-center justify-center text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-chevron-left mr-2"></i> 이전
                    </button>
                    <button onclick="nextCard()" id="nextBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition flex items-center justify-center text-sm shadow-md shadow-indigo-100">
                        다음 <i class="fa-solid fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- List drawer toggle button -->
            <button onclick="toggleWordList()" class="bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold py-3 px-4 rounded-2xl shadow-sm border border-slate-200 transition flex items-center justify-between">
                <span><i class="fa-solid fa-list-ul mr-2 text-indigo-500"></i> 전체 단어 목록 보기 (<span id="totalWordCount">0</span>개)</span>
                <i class="fa-solid fa-chevron-down" id="listToggleIcon"></i>
            </button>

            <!-- Word List Accordion -->
            <div id="wordListContainer" class="hidden bg-white rounded-2xl p-4 card-shadow border border-slate-100 max-h-60 overflow-y-auto">
                <div id="wordListItems" class="space-y-2">
                    <!-- Dynamic items -->
                </div>
            </div>
        </div>

    </main>

    <footer class="w-full max-w-xl text-center py-4 text-xs text-slate-400">
        <p>파닉스 단어 학습 앱 &copy; 2026. 음성 합성(TTS) 기능 지원</p>
    </footer>

    <script>
        let wordsData = [];
        let currentIndex = 0;

        const defaultWords = [
            { word: "web", meaning: "거미줄, 웹", exampleEn: "The spider built a web.", exampleKo: "거미가 거미줄을 쳤습니다." },
            { word: "pen", meaning: "펜", exampleEn: "I write with a blue pen.", exampleKo: "나는 파란색 펜으로 씁니다." },
            { word: "wet", meaning: "젖은", exampleEn: "My shoes are wet in the rain.", exampleKo: "비에 내 신발이 젖었습니다." },
            { word: "leg", meaning: "다리", exampleEn: "He hurt his left leg.", exampleKo: "그는 왼쪽 다리를 다쳤습니다." },
            { word: "hen", meaning: "암탉", exampleEn: "The hen lays an egg.", exampleKo: "암탉이 달걀을 낳습니다." },
            { word: "messy", meaning: "지저분한", exampleEn: "Your room is very messy.", exampleKo: "너의 방은 아주 지저분하다." },
            { word: "went", meaning: "갔다 (go의 과거)", exampleEn: "She went to the park.", exampleKo: "그녀는 공원에 갔습니다." },
            { word: "will", meaning: "~할 것이다", exampleEn: "I will help you.", exampleKo: "내가 너를 도울 거야." },
            { word: "egg", meaning: "달걀, 계란", exampleEn: "I eat a boiled egg.", exampleKo: "나는 삶은 계란을 먹습니다." },
            { word: "grass", meaning: "풀, 잔디", exampleEn: "The grass is green.", exampleKo: "잔디가 초록색입니다." },
            { word: "tell", meaning: "말하다", exampleEn: "Please tell me the truth.", exampleKo: "내게 진실을 말해 주세요." },
            { word: "miss", meaning: "그리워하다, 놓치다", exampleEn: "I miss my family.", exampleKo: "나는 가족이 그립습니다." },
            { word: "game", meaning: "게임, 경기", exampleEn: "Let's play a game.", exampleKo: "게임 한 판 하자." },
            { word: "these", meaning: "이것들", exampleEn: "These books are mine.", exampleKo: "이 책들은 내 것입니다." }
        ];

        function loadDefaultWords() {
            wordsData = defaultWords;
            currentIndex = 0;
            showCardView();
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            showLoading("이미지에서 단어 추출 중...");

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result.split(',')[1];
                try {
                    await extractWordsFromImage(base64Data, file.type);
                } catch (err) {
                    console.error(err);
                    alert("단어 추출 중 오류가 발생했습니다. 기본 단어장으로 대체합니다.");
                    loadDefaultWords();
                }
            };
            reader.readAsDataURL(file);
        }

        async function extractWordsFromImage(base64Data, mimeType) {
            const systemPrompt = "You are an expert English teacher. Analyze the provided image of a vocabulary/phonics list. Extract all English words visible in the image. For each word, provide its Korean meaning (뜻), and 1 simple example sentence in English (exampleEn) and its Korean translation (exampleKo). Output strictly in JSON format as an array of objects with keys: word, meaning, exampleEn, exampleKo.";
            const userQuery = "Extract all English words from this image along with their meanings and examples in JSON format.";

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: userQuery },
                            { inlineData: { mimeType: mimeType, data: base64Data } }
                        ]
                    }
                ],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                word: { type: "STRING" },
                                meaning: { type: "STRING" },
                                exampleEn: { type: "STRING" },
                                exampleKo: { type: "STRING" }
                            },
                            propertyOrdering: ["word", "meaning", "exampleEn", "exampleKo"]
                        }
                    }
                },
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            const candidate = result.candidates?.[0];
            if (candidate && candidate.content?.parts?.[0]?.text) {
                const text = candidate.content.parts[0].text;
                const parsed = JSON.parse(text);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    wordsData = parsed;
                    currentIndex = 0;
                    showCardView();
                    return;
                }
            }
            throw new Error("No words extracted");
        }

        function showLoading(text) {
            document.getElementById('uploadView').classList.add('hidden');
            document.getElementById('loadingView').classList.remove('hidden');
            document.getElementById('cardView').classList.add('hidden');
            document.getElementById('loadingText').innerText = text;
        }

        function showCardView() {
            document.getElementById('uploadView').classList.add('hidden');
            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('cardView').classList.remove('hidden');
            renderCard();
            renderWordList();
        }

        function backToUpload() {
            document.getElementById('uploadView').classList.remove('hidden');
            document.getElementById('cardView').classList.add('hidden');
            document.getElementById('imageInput').value = '';
        }

        function renderCard() {
            if (wordsData.length === 0) return;
            const item = wordsData[currentIndex];

            document.getElementById('cardWord').innerText = item.word;
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardExampleEn').innerText = item.exampleEn;
            document.getElementById('cardExampleKo').innerText = item.exampleKo;

            document.getElementById('progressIndicator').innerText = `${currentIndex + 1} / ${wordsData.length}`;
            document.getElementById('wordIndexBadge').innerText = `Word #${currentIndex + 1}`;

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === wordsData.length - 1;
            
            // Auto speak word on card change
            speakCurrentWord();
        }

        function nextCard() {
            if (currentIndex < wordsData.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function speakCurrentWord() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const item = wordsData[currentIndex];
            const utterance = new SpeechSynthesisUtterance(item.word);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function speakExample() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const item = wordsData[currentIndex];
            const utterance = new SpeechSynthesisUtterance(item.exampleEn);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function toggleWordList() {
            const container = document.getElementById('wordListContainer');
            const icon = document.getElementById('listToggleIcon');
            container.classList.toggle('hidden');
            icon.classList.toggle('fa-chevron-down');
            icon.classList.toggle('fa-chevron-up');
        }

        function renderWordList() {
            document.getElementById('totalWordCount').innerText = wordsData.length;
            const listEl = document.getElementById('wordListItems');
            listEl.innerHTML = '';

            wordsData.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition ${idx === currentIndex ? 'bg-indigo-50 border border-indigo-200 font-bold text-indigo-700' : 'hover:bg-slate-50 text-slate-700'}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-xs text-slate-400 w-5">#${idx + 1}</span>
                        <span class="text-sm font-semibold">${item.word}</span>
                    </div>
                    <span class="text-xs text-slate-500 truncate max-w-[150px]">${item.meaning}</span>
                `;
                div.onclick = () => {
                    currentIndex = idx;
                    renderCard();
                    renderWordList();
                };
                listEl.appendChild(div);
            });
        }
    </script>
</body>
</html>
