name: Deploy Word Study production to GitHub Pages

# GitHub Pages serves production (main) only.
# Development (dev) is served only from Cloudflare Pages (see deploy-cloudflare.yml).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp source-main/index.html dist/

          # Stamp the page with the actual GitHub Pages build time (Korea time).
          BUILD_TIME="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          sed -i "s|__LATEST_UPDATE__|${BUILD_TIME}|g" dist/index.html

          # Fail the build rather than publish a visible placeholder.
          if grep -q '__LATEST_UPDATE__' dist/index.html; then
            echo "::error::Latest update placeholder was not replaced."
            exit 1
          fi

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
