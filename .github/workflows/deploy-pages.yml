name: Deploy Word Study (main + dev)

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main

      - name: Checkout dev (development)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: source-dev

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist dist/dev
          cp -a source-main/. dist/
          rm -rf dist/.git dist/.github
          cp -a source-dev/. dist/dev/
          rm -rf dist/dev/.git dist/dev/.github

          # Stamp only the development page with the actual build time in Korea time.
          BUILD_TIME="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          sed -i "s|__LATEST_UPDATE__|${BUILD_TIME}|g" dist/dev/index.html

          # Fail the build rather than publish a visible placeholder on the development page.
          if grep -q '__LATEST_UPDATE__' dist/dev/index.html; then
            echo "::error::Latest update placeholder was not replaced."
            exit 1
          fi

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
